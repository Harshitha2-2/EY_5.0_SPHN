<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Harshitha Boga</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #20251f;
			--muted: #6d756c;
			--cream: #f6f3ed;
			--paper: #fffdf9;
			--line: #e7e1d7;
			--sage: #8da487;
			--deep-sage: #48634f;
			--coral: #d77d65;
			--shadow: 0 18px 45px rgba(50, 56, 45, .09);
		}

		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: var(--cream); font-family: "DM Sans", sans-serif; }
		button, input { font: inherit; }
		button { cursor: pointer; }
		.site-header { background: var(--paper); border-bottom: 1px solid var(--line); }
		.nav { max-width: 1240px; margin: auto; padding: 22px 28px; display: flex; align-items: center; justify-content: space-between; gap: 25px; }
		.logo { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-size: 17px; font-weight: 700; letter-spacing: .04em; }
		.logo-mark { width: 31px; height: 31px; display: grid; place-items: center; color: white; background: var(--deep-sage); border-radius: 50%; font-family: "Playfair Display", serif; font-size: 19px; }
		.nav-links { display: flex; gap: 30px; color: var(--muted); font-size: 13px; }
		.nav-links a { color: inherit; text-decoration: none; }
		.nav-links a:hover { color: var(--ink); }
		.cart-button { display: flex; align-items: center; gap: 9px; border: 0; color: var(--ink); background: transparent; font-size: 13px; font-weight: 700; }
		.cart-count { min-width: 23px; height: 23px; display: grid; place-items: center; color: white; background: var(--coral); border-radius: 50%; font-size: 11px; }
		main { max-width: 1240px; margin: auto; padding: 62px 28px 90px; }
		.hero { min-height: 235px; display: flex; align-items: end; justify-content: space-between; gap: 50px; padding-bottom: 48px; }
		.eyebrow { margin: 0 0 16px; color: var(--coral); font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
		h1, h2 { font-family: "Playfair Display", serif; font-weight: 600; line-height: 1.05; }
		h1 { max-width: 625px; margin: 0; font-size: clamp(43px, 6vw, 78px); letter-spacing: -.04em; }
		.hero-copy { max-width: 250px; margin: 0 0 6px; color: var(--muted); font-size: 14px; line-height: 1.7; }
		.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
		.filters { display: flex; gap: 9px; overflow-x: auto; scrollbar-width: none; }
		.filters::-webkit-scrollbar { display: none; }
		.filter { flex: 0 0 auto; padding: 10px 15px; border: 1px solid var(--line); border-radius: 30px; color: var(--muted); background: transparent; font-size: 12px; text-transform: capitalize; transition: .2s; }
		.filter:hover, .filter.active { border-color: var(--deep-sage); color: white; background: var(--deep-sage); }
		.search-wrap { position: relative; width: 230px; flex: 0 0 auto; }
		.search-wrap span { position: absolute; top: 50%; left: 13px; color: var(--muted); transform: translateY(-50%); }
		#search { width: 100%; padding: 11px 13px 11px 36px; border: 1px solid var(--line); border-radius: 5px; outline-color: var(--sage); background: var(--paper); font-size: 12px; }
		.product-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px 20px; padding-top: 36px; }
		.product-card { position: relative; min-width: 0; animation: rise .45s both; }
		.product-image { height: 285px; display: grid; place-items: center; padding: 30px; overflow: hidden; background: white; }
		.product-image img { width: 82%; height: 82%; object-fit: contain; mix-blend-mode: multiply; transition: transform .35s ease; }
		.product-card:hover .product-image img { transform: scale(1.06); }
		.product-info { padding-top: 16px; }
		.product-category { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
		.product-name { min-height: 40px; margin: 8px 0 12px; font-family: "Playfair Display", serif; font-size: 16px; line-height: 1.3; }
		.product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
		.price { font-size: 14px; font-weight: 700; }
		.add-button { padding: 8px 11px; border: 1px solid var(--deep-sage); border-radius: 3px; color: var(--deep-sage); background: transparent; font-size: 11px; font-weight: 700; transition: .2s; }
		.add-button:hover { color: white; background: var(--deep-sage); }
		.status { padding: 70px 0; color: var(--muted); text-align: center; grid-column: 1 / -1; }
		.status strong { display: block; margin-bottom: 8px; color: var(--ink); font-family: "Playfair Display", serif; font-size: 24px; }
		.retry { margin-top: 18px; padding: 10px 16px; border: 0; color: white; background: var(--coral); border-radius: 3px; }
		.drawer-backdrop { position: fixed; inset: 0; z-index: 5; visibility: hidden; background: rgba(32, 37, 31, .35); opacity: 0; transition: .25s; }
		.drawer-backdrop.open { visibility: visible; opacity: 1; }
		.cart-drawer { position: fixed; inset: 0 0 0 auto; z-index: 6; width: min(390px, 100%); padding: 28px; background: var(--paper); transform: translateX(100%); transition: transform .3s ease; }
		.drawer-backdrop.open .cart-drawer { transform: translateX(0); }
		.drawer-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
		.drawer-head h2 { margin: 0; font-size: 29px; }
		.close { border: 0; color: var(--muted); background: transparent; font-size: 24px; }
		#cart-items { max-height: 60vh; overflow: auto; }
		.cart-item { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 17px 0; border-bottom: 1px solid var(--line); }
		.cart-item img { width: 54px; height: 54px; object-fit: contain; background: white; }
		.cart-item-name { margin-bottom: 5px; font-size: 12px; line-height: 1.4; }
		.cart-item-price { color: var(--muted); font-size: 11px; }
		.remove { border: 0; color: var(--coral); background: transparent; font-size: 11px; }
		.cart-empty { padding: 50px 0; color: var(--muted); text-align: center; font-size: 13px; }
		.cart-total { display: flex; justify-content: space-between; margin-top: 25px; font-weight: 700; }
		.checkout { width: 100%; margin-top: 20px; padding: 14px; border: 0; color: white; background: var(--deep-sage); font-weight: 700; }
		@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 850px) { .product-grid { grid-template-columns: repeat(3, 1fr); } .product-image { height: 230px; } }
		@media (max-width: 620px) { .nav { padding: 18px 18px; } .nav-links { display: none; } main { padding: 40px 18px 70px; } .hero { min-height: 0; display: block; padding-bottom: 35px; } .hero-copy { margin-top: 23px; } .toolbar { align-items: stretch; flex-direction: column-reverse; } .search-wrap { width: 100%; } .product-grid { grid-template-columns: repeat(2, 1fr); gap: 27px 13px; padding-top: 28px; } .product-image { height: 190px; padding: 20px; } .product-name { font-size: 15px; } }
	</style>
</head>
<body>
	<header class="site-header">
		<nav class="nav" aria-label="Main navigation">
			<a class="logo" href="#"><span class="logo-mark">M</span> MAISON MARKET</a>
			<div class="nav-links"><a href="#collection">Collection</a><a href="#about">Our story</a></div>
			<button class="cart-button" id="open-cart" aria-label="Open shopping cart">Bag <span class="cart-count" id="cart-count">0</span></button>
		</nav>
	</header>
	<main id="collection">
		<section class="hero">
			<div><p class="eyebrow">The everyday edit / 2026</p><h1>Objects with a little more thought.</h1></div>
			<p class="hero-copy">A considered collection of things made to be used, loved, and lived with.</p>
		</section>
		<section class="toolbar" aria-label="Product controls">
			<div class="filters" id="filters"><button class="filter active" data-category="all">All pieces</button></div>
			<label class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="Search the collection" aria-label="Search products"></label>
		</section>
		<section class="product-grid" id="product-grid" aria-live="polite">
			<div class="status"><strong>Gathering the collection</strong>Just a moment...</div>
		</section>
	</main>

	<div class="drawer-backdrop" id="drawer" aria-hidden="true">
		<aside class="cart-drawer" aria-label="Shopping bag">
			<div class="drawer-head"><h2>Your bag</h2><button class="close" id="close-cart" aria-label="Close shopping cart">×</button></div>
			<div id="cart-items"></div>
			<div class="cart-total"><span>Total</span><span id="cart-total">$0.00</span></div>
			<button class="checkout" id="checkout">Continue to checkout</button>
		</aside>
	</div>

	<script>
		const API_URL = "https://fakestoreapi.com/products";
		const grid = document.querySelector("#product-grid");
		const filters = document.querySelector("#filters");
		const search = document.querySelector("#search");
		const drawer = document.querySelector("#drawer");
		let products = [];
		let activeCategory = "all";
		let cart = JSON.parse(localStorage.getItem("maison-cart") || "[]");

		const money = value => `$${Number(value).toFixed(2)}`;
		const titleCase = value => value.replace(/\b\w/g, letter => letter.toUpperCase());

		function renderProducts() {
			const term = search.value.trim().toLowerCase();
			const visible = products.filter(product => {
				const categoryMatch = activeCategory === "all" || product.category === activeCategory;
				const searchMatch = product.title.toLowerCase().includes(term) || product.description.toLowerCase().includes(term);
				return categoryMatch && searchMatch;
			});
			if (!visible.length) {
				grid.innerHTML = '<div class="status"><strong>No pieces found</strong>Try a different search or category.</div>';
				return;
			}
			grid.innerHTML = visible.map((product, index) => `
				<article class="product-card" style="animation-delay:${index * 45}ms">
					<div class="product-image"><img src="${product.image}" alt="${product.title}" loading="lazy"></div>
					<div class="product-info"><div class="product-category">${product.category}</div>
						<h2 class="product-name">${product.title}</h2>
						<div class="product-bottom"><span class="price">${money(product.price)}</span><button class="add-button" data-add="${product.id}">Add to bag</button></div>
					</div>
				</article>`).join("");
		}

		function renderCart() {
			document.querySelector("#cart-count").textContent = cart.length;
			const items = document.querySelector("#cart-items");
			if (!cart.length) items.innerHTML = '<div class="cart-empty">Your bag is waiting to be filled.</div>';
			else items.innerHTML = cart.map(item => `<div class="cart-item"><img src="${item.image}" alt=""><div><div class="cart-item-name">${item.title}</div><div class="cart-item-price">${money(item.price)}</div></div><button class="remove" data-remove="${item.id}">Remove</button></div>`).join("");
			document.querySelector("#cart-total").textContent = money(cart.reduce((sum, item) => sum + Number(item.price), 0));
			localStorage.setItem("maison-cart", JSON.stringify(cart));
		}

		function showCart(open) { drawer.classList.toggle("open", open); drawer.setAttribute("aria-hidden", String(!open)); }

		async function loadProducts() {
			try {
				const response = await fetch(API_URL);
				if (!response.ok) throw new Error("Request failed");
				products = await response.json();
				const categories = [...new Set(products.map(product => product.category))];
				filters.insertAdjacentHTML("beforeend", categories.map(category => `<button class="filter" data-category="${category}">${titleCase(category)}</button>`).join(""));
				renderProducts();
			} catch (error) {
				grid.innerHTML = '<div class="status"><strong>Could not load the collection</strong>Please check your connection and try again.<br><button class="retry" id="retry">Try again</button></div>';
				document.querySelector("#retry").addEventListener("click", loadProducts);
			}
		}

		filters.addEventListener("click", event => {
			const button = event.target.closest(".filter");
			if (!button) return;
			activeCategory = button.dataset.category;
			document.querySelectorAll(".filter").forEach(item => item.classList.toggle("active", item === button));
			renderProducts();
		});
		search.addEventListener("input", renderProducts);
		grid.addEventListener("click", event => {
			const id = Number(event.target.dataset.add);
			if (!id) return;
			const product = products.find(item => item.id === id);
			if (product && !cart.some(item => item.id === id)) cart.push(product);
			renderCart();
		});
		document.querySelector("#cart-items").addEventListener("click", event => {
			const id = Number(event.target.dataset.remove);
			if (!id) return;
			cart = cart.filter(item => item.id !== id);
			renderCart();
		});
		document.querySelector("#open-cart").addEventListener("click", () => showCart(true));
		document.querySelector("#close-cart").addEventListener("click", () => showCart(false));
		drawer.addEventListener("click", event => { if (event.target === drawer) showCart(false); });
		document.querySelector("#checkout").addEventListener("click", () => alert(cart.length ? "Thanks for shopping with Maison Market." : "Your bag is empty."));
		renderCart();
		loadProducts();
	</script>
</body>
</html>
